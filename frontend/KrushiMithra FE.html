<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3d2a">
<title>KrushiMithra</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Noto+Sans+Kannada:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+Telugu:wght@400;600&family=Noto+Sans+Tamil:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--g1:#0b3d2a;--g2:#14804a;--g3:#52c57a;--lime:#b7e36a;--gold:#f6b93b;--bg:#f2f7ee;--ink:#17301f;--mut:#5f7566;--line:#e1ebdc;--card:#fff;--red:#d9534f}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Poppins','Noto Sans Kannada','Noto Sans Devanagari','Noto Sans Telugu','Noto Sans Tamil',system-ui,sans-serif;background:radial-gradient(circle at 20% 10%,#2c9a5f 0,#0b3d2a 62%) fixed;min-height:100vh;display:flex;justify-content:center;color:var(--ink);font-size:14px}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
#phone{width:100%;max-width:440px;height:100vh;height:100dvh;background:var(--bg);position:relative;overflow:hidden;box-shadow:0 0 70px rgba(0,0,0,.45)}
@media(min-width:600px){body{align-items:center;padding:18px}#phone{height:880px;max-height:94vh;border-radius:38px;border:6px solid #08281b}}
#view{position:absolute;inset:0 0 72px 0;overflow-y:auto;scroll-behavior:smooth}
#view.nonav{bottom:0}
#nav{position:absolute;left:0;right:0;bottom:0;height:72px;background:#fff;border-radius:24px 24px 0 0;box-shadow:0 -6px 24px rgba(11,61,42,.12);display:flex;justify-content:space-around;align-items:center;z-index:5}
#nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 10px;border-radius:14px;color:var(--mut);transition:.2s}
#nav button span{font-size:20px}
#nav button small{font-size:10.5px;font-weight:500}
#nav button.on{color:var(--g2);background:#e6f5ea;font-weight:700}
/* splash */
#splash{position:absolute;inset:0;z-index:30;background:linear-gradient(160deg,#0b3d2a 0,#14804a 55%,#7bcf6f 120%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;transition:opacity .6s,visibility .6s;overflow:hidden}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.sun{position:absolute;top:-80px;right:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(246,185,59,.55),transparent 65%);animation:pulse 4s infinite}
@keyframes pulse{50%{transform:scale(1.15);opacity:.7}}
.field{position:absolute;bottom:0;left:0;right:0;height:34%;background:repeating-linear-gradient(100deg,rgba(0,0,0,.12) 0 14px,transparent 14px 34px);clip-path:polygon(0 30%,100% 0,100% 100%,0 100%)}
.sprout{width:150px;height:150px;position:relative;z-index:2}
.stem{stroke-dasharray:60;stroke-dashoffset:60;animation:draw 1.1s .3s forwards}
.leaf{transform-origin:60px 62px;transform:scale(0);animation:pop .7s forwards}
.l1{animation-delay:1.1s}.l2{animation-delay:1.45s;transform-origin:60px 52px}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes pop{70%{transform:scale(1.12)}to{transform:scale(1)}}
.sp-title{font-size:34px;font-weight:800;letter-spacing:.5px;margin-top:10px;z-index:2}
.sp-title span{display:inline-block;opacity:0;transform:translateY(14px);animation:rise .5s forwards}
@keyframes rise{to{opacity:1;transform:none}}
.sp-tag{margin-top:6px;opacity:0;animation:rise .6s 1.9s forwards;z-index:2;font-weight:500;color:#d8f3a0}
.sp-bar{margin-top:30px;width:150px;height:5px;border-radius:5px;background:rgba(255,255,255,.2);overflow:hidden;z-index:2}
.sp-bar i{display:block;height:100%;width:0;background:var(--lime);animation:load 3s .1s forwards}
@keyframes load{to{width:100%}}
/* login */
.login{min-height:100%;background:linear-gradient(180deg,#0b3d2a,#14804a 70%)}
.lg-top{padding:36px 24px 70px;color:#fff;text-align:center;position:relative}
.logo-sm{width:76px;height:76px;margin:0 auto 10px;border-radius:24px;background:rgba(255,255,255,.14);display:grid;place-items:center;border:1px solid rgba(255,255,255,.3)}
.lg-top h1{font-size:26px;font-weight:800}.lg-top p{color:#d8f3a0;font-size:13px}
.lgsel{position:absolute;top:14px;right:14px}
.lg-card{background:var(--bg);border-radius:30px 30px 0 0;padding:28px 22px;margin-top:-34px;min-height:430px;position:relative}
.lg-card h2{font-size:20px;margin-bottom:4px}.lg-card p.s{color:var(--mut);margin-bottom:20px}
.phone-in{display:flex;align-items:center;background:#fff;border:2px solid var(--line);border-radius:16px;overflow:hidden;transition:.2s}
.phone-in:focus-within{border-color:var(--g3)}
.phone-in b{padding:0 12px;border-right:1px solid var(--line);color:var(--g2)}
.phone-in input{flex:1;border:0;outline:0;padding:15px 12px;font-size:17px;letter-spacing:1px;background:transparent;min-width:0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:16px;font-weight:700;background:linear-gradient(135deg,var(--g2),#0e6a3b);color:#fff;box-shadow:0 8px 20px rgba(20,128,74,.35);margin-top:16px;transition:.15s}
.btn:active{transform:scale(.98)}
.btn.alt{background:#fff;color:var(--g2);box-shadow:none;border:2px solid var(--g2)}
.btn.gold{background:linear-gradient(135deg,#f6b93b,#e69a0c);box-shadow:0 8px 20px rgba(230,154,12,.35)}
.btn.sm{width:auto;padding:10px 16px;margin:0;font-size:13px;border-radius:12px}
.btn[disabled]{opacity:.5;pointer-events:none}
.otps{display:flex;gap:12px;justify-content:center;margin:10px 0 6px}
.otps input{width:58px;height:62px;text-align:center;font-size:26px;font-weight:700;border:2px solid var(--line);border-radius:16px;outline:0;background:#fff}
.otps input:focus{border-color:var(--g3)}
.hint{text-align:center;color:var(--mut);font-size:12px;margin-top:6px}
.lang{background:rgba(255,255,255,.95);border:0;border-radius:12px;padding:7px 8px;font-weight:600;color:var(--g1);outline:0}
/* generic */
.wrap{padding:16px}
.bar{display:flex;align-items:center;gap:10px;padding:16px;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-radius:0 0 26px 26px}
.bar h2{font-size:18px;flex:1}.bar .bk{width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.18);color:#fff;font-size:18px}
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:0 6px 20px rgba(23,48,31,.07);margin-bottom:14px}
.card h3{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.mut{color:var(--mut)}.row{display:flex;align-items:center;gap:10px}.sp{flex:1}
.chip{display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border-radius:999px;background:#e6f5ea;color:var(--g2);font-weight:600;font-size:12px}
.chip.gold{background:#fff3d6;color:#a86b00}
.list{list-style:none}.list li{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);line-height:1.45}.list li:last-child{border:0}
.list li::before{content:attr(data-i);flex:none}
.note{background:#fff8e1;border:1px solid #ffe29a;color:#7a5600;border-radius:14px;padding:11px 13px;font-size:12.5px;margin-bottom:14px;line-height:1.5}
.warn{background:#fdecea;border-color:#f5c2be;color:#8a1f17}
.link{color:var(--g2);font-weight:700;text-decoration:underline}
.ring{--p:70;width:64px;height:64px;flex:none;border-radius:50%;background:conic-gradient(var(--g2) calc(var(--p)*1%),#dfe9dc 0);display:grid;place-items:center;position:relative}
.ring::before{content:'';position:absolute;inset:7px;background:#fff;border-radius:50%}.ring b{position:relative;font-size:14px}
.ring.big{width:84px;height:84px}.ring.big b{font-size:19px}
.fi{width:100%;padding:13px 14px;border-radius:14px;border:2px solid var(--line);background:#fff;outline:0;margin:6px 0 14px}
.fi:focus{border-color:var(--g3)}
label.l{font-weight:600;font-size:13px}
/* permissions */
.perm{padding:34px 20px;min-height:100%;background:linear-gradient(180deg,#e9f6e8,var(--bg))}
.perm h2{font-size:24px}.perm p.s{color:var(--mut);margin:4px 0 22px}
.pc{display:flex;align-items:center;gap:14px;background:#fff;border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 6px 18px rgba(23,48,31,.07)}
.pc .e{width:52px;height:52px;border-radius:16px;background:#e6f5ea;display:grid;place-items:center;font-size:26px}
.pc small{color:var(--mut)}.pc .ok{color:var(--g2);font-weight:700}
/* home */
.hero{background:linear-gradient(150deg,var(--g1),var(--g2));padding:22px 18px 46px;border-radius:0 0 34px 34px;color:#fff;position:relative}
.hero .top{display:flex;justify-content:space-between;align-items:center}.hero small{color:#c9efb0}.hero h2{font-size:20px}
.search{position:absolute;left:18px;right:18px;bottom:-26px;background:#fff;border-radius:18px;display:flex;align-items:center;padding:5px 6px 5px 16px;box-shadow:0 12px 28px rgba(11,61,42,.25);gap:4px}
.search input{flex:1;border:0;outline:0;padding:11px 0;background:transparent;min-width:0}
.search button{width:42px;height:42px;border-radius:14px;background:#e6f5ea;color:var(--g2);display:grid;place-items:center}
.search button.mic{background:var(--g2);color:#fff}
body.listening .mic{animation:ring 1s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(20,128,74,.6)}100%{box-shadow:0 0 0 16px rgba(20,128,74,0)}}
.wx{margin-top:42px;border-radius:24px;padding:18px;color:#fff;background:linear-gradient(145deg,#2f80ed,#56ccf2);box-shadow:0 10px 26px rgba(47,128,237,.3);position:relative;overflow:hidden}
.wx.night{background:linear-gradient(145deg,#1d3557,#457b9d)}
.wx .big{font-size:48px;font-weight:700;line-height:1}.wx .ic{font-size:56px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.2))}
.wx .st{display:flex;gap:8px;margin-top:14px}.wx .st div{flex:1;background:rgba(255,255,255,.18);border-radius:14px;padding:8px;text-align:center;font-size:12px}
.wx .st b{display:block;font-size:14px}
.days{display:flex;gap:8px;margin-top:12px;overflow-x:auto}.days div{flex:1;min-width:58px;text-align:center;font-size:11px;background:rgba(255,255,255,.14);border-radius:12px;padding:7px 4px}
.skel{height:170px;border-radius:24px;margin-top:42px;background:linear-gradient(90deg,#e1ebdc,#f1f6ee,#e1ebdc);background-size:200% 100%;animation:sk 1.3s infinite}
@keyframes sk{to{background-position:-200% 0}}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.tile{background:#fff;border-radius:20px;padding:16px;text-align:left;box-shadow:0 6px 18px rgba(23,48,31,.07);transition:.2s;position:relative;overflow:hidden}
.tile:active{transform:scale(.97)}
.tile .e{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:24px;margin-bottom:10px}
.tile b{font-size:13.5px}
/* steps */
.steps{display:flex;gap:6px;padding:16px 16px 0}
.steps div{flex:1;text-align:center;font-size:11px;color:var(--mut);font-weight:600}
.steps i{display:block;height:6px;border-radius:6px;background:#d9e6d4;margin-bottom:6px}
.steps div.on{color:var(--g2)}.steps div.on i{background:var(--g2)}
.photo{height:230px;border-radius:22px;background:#e6efe1 center/cover;border:2px dashed #b9d1b1;display:grid;place-items:center;color:var(--mut);overflow:hidden;position:relative;text-align:center}
.scan::after{content:'';position:absolute;left:0;right:0;height:60px;background:linear-gradient(180deg,transparent,rgba(82,197,122,.7),transparent);animation:scan 1.4s infinite alternate}
@keyframes scan{from{top:-30px}to{top:200px}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bars .b{margin:10px 0}.bars .t{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px}
.bars .tr{height:9px;background:#e7efe3;border-radius:9px;overflow:hidden}.bars .tr i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--g3),var(--g2))}
/* reco */
.top-crop{background:linear-gradient(150deg,var(--g1),var(--g2));color:#fff;border-radius:26px;padding:20px;margin-bottom:14px;position:relative;overflow:hidden}
.top-crop .em{font-size:60px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.3))}
.top-crop .ring::before{background:#0f5d37}.top-crop .ring{background:conic-gradient(var(--lime) calc(var(--p)*1%),rgba(255,255,255,.2) 0)}
.top-crop p{line-height:1.6;margin:12px 0;color:#e5f6dc}
.mini{display:flex;gap:8px}.mini div{flex:1;background:rgba(255,255,255,.14);border-radius:14px;padding:9px;text-align:center;font-size:11.5px}.mini b{display:block;font-size:14px}
.crow{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:#fff;margin-bottom:10px;box-shadow:0 4px 14px rgba(23,48,31,.06);width:100%;text-align:left;transition:.15s}
.crow:active{transform:scale(.98)}.crow .em{font-size:30px}
.crow.sel{outline:3px solid var(--g3);background:#effaf0}
.crow .tr{height:7px;border-radius:7px;background:#e7efe3;margin-top:6px;overflow:hidden}.crow .tr i{display:block;height:100%;background:linear-gradient(90deg,var(--g3),var(--g2))}
.modal{position:absolute;inset:0;background:rgba(8,40,27,.55);z-index:40;display:flex;align-items:flex-end;opacity:0;visibility:hidden;transition:.25s}
.modal.open{opacity:1;visibility:visible}
.sheet{background:var(--bg);width:100%;max-height:88%;overflow-y:auto;border-radius:28px 28px 0 0;padding:20px;transform:translateY(40px);transition:.3s}
.modal.open .sheet{transform:none}
.sheet.cam{padding:0;height:100%;max-height:100%;border-radius:0;background:#000;position:relative}
.sheet video{width:100%;height:100%;object-fit:cover}
.camctl{position:absolute;bottom:34px;left:0;right:0;display:flex;justify-content:space-around;align-items:center}
.camctl .rb{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.25);color:#fff;font-size:20px}
.shutter{width:76px;height:76px;border-radius:50%;background:#fff;border:6px solid rgba(255,255,255,.5);box-shadow:0 0 0 4px rgba(0,0,0,.3)}
/* plan */
.tl{display:flex;justify-content:space-between;position:relative;margin:10px 0 4px}
.tl::before{content:'';position:absolute;left:8%;right:8%;top:18px;height:4px;background:#dfe9dc;border-radius:4px}
.tl div{text-align:center;position:relative;flex:1;font-size:11px}
.tl i{display:grid;place-items:center;margin:0 auto 6px;width:38px;height:38px;border-radius:50%;background:var(--g2);color:#fff;font-style:normal;box-shadow:0 0 0 5px #e6f5ea}
.tl b{display:block;font-size:11.5px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.trio div{background:#fff;border-radius:18px;padding:12px 8px;text-align:center;box-shadow:0 4px 14px rgba(23,48,31,.06)}
.trio small{color:var(--mut);display:block;font-size:11px}.trio b{font-size:15px}
.trio .pf b{color:var(--g2)}
svg text{font-family:inherit}
/* chat */
.chat{display:flex;flex-direction:column;min-height:100%}
.msgs{flex:1;padding:14px;display:flex;flex-direction:column;gap:10px}
.bub{max-width:84%;padding:11px 14px;border-radius:18px;line-height:1.5;white-space:pre-line;animation:rise .3s both}
.bub.bot{background:#fff;border-bottom-left-radius:5px;box-shadow:0 4px 12px rgba(23,48,31,.07)}
.bub.me{background:linear-gradient(135deg,var(--g2),#0e6a3b);color:#fff;align-self:flex-end;border-bottom-right-radius:5px}
.bub .act{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.sug{display:flex;gap:8px;overflow-x:auto;padding:0 14px 8px}.sug button{white-space:nowrap;background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:12.5px;font-weight:500}
.chatbar{position:sticky;bottom:0;background:var(--bg);padding:8px 14px 12px;display:flex;gap:8px;align-items:center}
.chatbar input{flex:1;border:2px solid var(--line);background:#fff;border-radius:16px;padding:12px 14px;outline:0;min-width:0}
.chatbar button{width:46px;height:46px;border-radius:15px;background:var(--g2);color:#fff;display:grid;place-items:center;flex:none}
.spk{display:inline-flex;align-items:center;gap:6px;color:var(--g2);font-weight:700;font-size:12px;margin-top:6px;background:#e6f5ea;padding:5px 10px;border-radius:10px}
.top-crop .spk{background:rgba(255,255,255,.18);color:#fff}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 4px}.tabs button{white-space:nowrap;padding:9px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);font-weight:600;font-size:12.5px}
.tabs button.on{background:var(--g2);color:#fff;border-color:var(--g2)}
.menu{display:flex;align-items:center;gap:14px;background:#fff;padding:15px;border-radius:18px;margin-bottom:10px;width:100%;text-align:left;box-shadow:0 4px 14px rgba(23,48,31,.06)}
.menu .e{width:44px;height:44px;border-radius:14px;background:#e6f5ea;display:grid;place-items:center;font-size:22px}
#toast{position:absolute;left:50%;bottom:92px;transform:translate(-50%,20px);background:#17301f;color:#fff;padding:11px 18px;border-radius:14px;opacity:0;transition:.3s;z-index:60;max-width:88%;text-align:center;pointer-events:none;font-size:13px}
#toast.show{opacity:1;transform:translate(-50%,0)}
.stepper{display:flex;align-items:center;gap:10px}.stepper button{width:42px;height:42px;border-radius:14px;background:#e6f5ea;font-size:22px;font-weight:700;color:var(--g2)}
.stepper input{width:80px;text-align:center;font-size:20px;font-weight:700;border:2px solid var(--line);border-radius:14px;padding:8px;outline:0}
.bud .r{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px}
</style>
</head>
<body>
<div id="phone">
  <div id="view" class="nonav"></div>
  <nav id="nav" style="display:none"></nav>
  <div id="splash">
    <div class="sun"></div><div class="field"></div>
    <svg class="sprout" viewBox="0 0 120 120"><defs><linearGradient id="lgx" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d8f3a0"/><stop offset="1" stop-color="#3fb36b"/></linearGradient></defs><circle cx="60" cy="60" r="56" fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.25)"/><ellipse cx="60" cy="100" rx="24" ry="6" fill="rgba(0,0,0,.25)"/><path class="stem" d="M60 98 C60 80 60 66 60 52" stroke="#d8f3a0" stroke-width="5" fill="none" stroke-linecap="round"/><path class="leaf l1" d="M60 62 C40 62 28 50 26 34 C44 34 58 44 60 62Z" fill="url(#lgx)"/><path class="leaf l2" d="M60 52 C80 52 92 40 94 24 C76 24 62 34 60 52Z" fill="url(#lgx)"/></svg>
    <div class="sp-title" id="spt"></div>
    <div class="sp-tag" id="spg"></div>
    <div class="sp-bar"><i></i></div>
  </div>
  <div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>
  <div id="toast"></div>
</div>

<script>
/* ===================== i18n ===================== */
const LANGS={en:'English',hi:'हिन्दी',kn:'ಕನ್ನಡ',te:'తెలుగు',ta:'தமிழ்'};
const LC={en:'en-IN',hi:'hi-IN',kn:'kn-IN',te:'te-IN',ta:'ta-IN'};
const L={
en:{tagline:'Your smart farming friend',lang:'Language',login_t:'Welcome, farmer!',login_s:'Log in with your mobile number',phone:'Mobile number',send_otp:'Send OTP',otp_t:'Enter the 4-digit OTP',otp_hint:'Demo OTP: 1234',verify:'Verify and login',bad_phone:'Enter a valid 10-digit number',bad_otp:'Wrong OTP',
perm_t:'Allow permissions',perm_s:'These help KrushiMithra guide you better',loc:'Location',loc_d:'Weather and region-based advice',cam:'Camera',cam_d:'Scan soil and crops',mic:'Microphone',mic_d:'Talk to the assistant',allow:'Allow',allowed:'Allowed',cont:'Continue',perm_denied:'Permission denied. You can still continue with demo data.',
hello:'Namaste',search_ph:'Ask or search anything…',weather:'Weather today',humidity:'Humidity',wind:'Wind',rain:'Rain',outlook:'5-day outlook',
w_clear:'Clear',w_cloud:'Cloudy',w_rain:'Rain',w_storm:'Thunderstorm',w_fog:'Fog',warn_rain:'Heavy rain expected in the next 5 days. Tap for protection steps.',warn_heat:'Very hot days ahead. Tap for protection steps.',

let toastT;
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),2600)}
function showModal(h,cls){$('#sheet').className='sheet '+(cls||'');$('#sheet').innerHTML=h;$('#modal').classList.add('open')}
function closeModal(){$('#modal').classList.remove('open');stopStream()}
function speak(text){
  if(!('speechSynthesis' in window)){toast(t('no_tts'));return}
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=LC[app.lang];
  const vs=speechSynthesis.getVoices();const v=vs.find(x=>x.lang.replace('_','-')===LC[app.lang])||vs.find(x=>x.lang.toLowerCase().startsWith(app.lang));
  if(v)u.voice=v;u.rate=.92;speechSynthesis.speak(u);
}
if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=()=>{};
function listen(cb){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast(t('no_sr'));return}
  const r=new SR();r.lang=LC[app.lang];r.interimResults=false;r.maxAlternatives=1;
  r.onresult=e=>cb(e.results[0][0].transcript);r.onerror=()=>toast(t('no_sr'));r.onend=()=>document.body.classList.remove('listening');
  document.body.classList.add('listening');try{r.start()}catch(e){document.body.classList.remove('listening')}
}
let stream=null,facing='environment',camCb=null;
function stopStream(){if(stream){stream.getTracks().forEach(x=>x.stop());stream=null}}
async function startStream(){
  try{stopStream();stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing}});const v=$('#vid');if(v)v.srcObject=stream}
  catch(e){closeModal();toast(t('cam_fail'))}
}
function openCam(cb){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast(t('cam_fail'));return}
  camCb=cb;
  showModal('<video id="vid" autoplay playsinline muted></video><div class="camctl"><button class="rb" onclick="closeModal()">✕</button><button class="shutter" onclick="snap()"></button><button class="rb" onclick="flipCam()">⟲</button></div>','cam');
  startStream();
}
function flipCam(){facing=facing==='environment'?'user':'environment';startStream()}
function snap(){
  const v=$('#vid');if(!v||!v.videoWidth)return;const c=document.createElement('canvas');const sc=Math.min(1,720/v.videoWidth);
  c.width=v.videoWidth*sc;c.height=v.videoHeight*sc;c.getContext('2d').drawImage(v,0,0,c.width,c.height);
  const url=c.toDataURL('image/jpeg',.85);closeModal();if(camCb)camCb(url);
}

/* ===================== recommendation engine ===================== */
function computeReco(){
  const temp=app.weather?app.weather.temp:26;const st=app.soil||{type:'loam',fert:60};const prev=CROPS[app.prevCrop];const sea=season();
  app.reco=Object.entries(CROPS).map(([id,c])=>{
    let s=55;const reasons=[];
    if(c.seasons.includes(sea))s+=15;else{s-=18;reasons.push('r_season')}
    if(temp>=c.T[0]&&temp<=c.T[1])s+=12;else{s-=Math.min(20,(temp<c.T[0]?c.T[0]-temp:temp-c.T[1])*2);reasons.push('r_temp')}
    if(c.soils.includes(st.type))s+=12;else{s-=8;reasons.push('r_soil')}
    if(app.prevCrop===id){s-=20;reasons.push('r_rot')}
    else if(prev){if(prev.fam==='legume'&&c.fam!=='legume')s+=8;if(prev.fam==='cereal'&&c.fam==='legume')s+=8}
    if(st.fert<45)s+=c.hardy?5:-6;else if(st.fert>70)s+=3;
    return{id,score:Math.round(Math.max(35,Math.min(97,s))),reasons};
  }).sort((a,b)=>b.score-a.score);
}
function planData(id,acres){
  const c=CROPS[id];const ph=c.price*(1+c.trend);const cost=c.cost.reduce((a,b)=>a+b,0)*acres;const inc=c.yield*ph*acres;
  const sow=new Date();sow.setDate(sow.getDate()+3);const hv=new Date(sow);hv.setDate(hv.getDate()+c.days);
  const stage=f=>{const d=new Date(sow);d.setDate(d.getDate()+Math.round(c.days*f));return d};
  const series=[];for(let i=0;i<6;i++){const d=new Date(sow);d.setDate(d.getDate()+Math.round(c.days*i/5));
    const v=i===5?ph:c.price*(1+c.trend*i/5)*(1+.025*Math.sin(i*1.7+id.length));series.push({d,v})}
  return{cost,inc,net:inc-cost,ph,sow,hv,grow:stage(.35),flower:stage(.65),series,parts:c.cost.map(x=>x*acres)};
}
function netPerAcre(id){const p=planData(id,1);return p.net}

function soilFromPhoto(src){return new Promise(res=>{
  const fallback=()=>res(buildSoil(120,100,80));const im=new Image();im.onerror=fallback;
  im.onload=()=>{try{const c=document.createElement('canvas');c.width=c.height=48;const x=c.getContext('2d');x.drawImage(im,0,0,48,48);const d=x.getImageData(0,0,48,48).data;let r=0,g=0,b=0;const n=d.length/4;
    for(let i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];b+=d[i+2]}res(buildSoil(r/n,g/n,b/n))}catch(e){fallback()}};im.src=src;
})}
function buildSoil(r,g,b){
  const br=(r+g+b)/3;let type='loam';
  if(br<80)type='black';else if(r>g*1.22&&r>b*1.45)type='red';else if(br>150)type='sandy';
  let fert=100-br*.45;fert+=app.prevFert==='organic'?8:app.prevFert==='both'?4:app.prevFert==='none'?-6:0;
  const pc=CROPS[app.prevCrop];if(pc&&pc.fam==='legume')fert+=6;if(app.prevCrop==='none')fert+=3;
  fert=Math.round(Math.max(25,Math.min(92,fert)));const lv=v=>v>66?2:v>46?1:0;
  const N=lv(fert+(pc&&pc.fam==='legume'?5:-3)),P=lv(fert+((r|0)%15)-7),K=lv(fert+((b|0)%15)-7);
  const tr=[];if(fert<50)tr.push('tr_fym');if(N===0)tr.push('tr_green');if(type==='red')tr.push('tr_lime');if(type==='black')tr.push('tr_gypsum');if(type==='sandy')tr.push('tr_compost');if(!tr.length)tr.push('tr_ok');
  return{type,fert,N,P,K,ph:PH[type],tr};
}

R.decide=()=>{
  computeReco();if(!app.chosen)app.chosen=app.reco[0].id;
  return bar(t('decide_t'),'reco')+`<div class="wrap">${app.reco.slice(0,4).map(r=>`<button class="crow ${app.chosen===r.id?'sel':''}" onclick="app.chosen='${r.id}';render()"><span class="em">${CROPS[r.id].icon}</span><div class="sp"><b>${cn(r.id)}</b><div class="mut" style="font-size:12px">${CROPS[r.id].days} ${t('days')} · ${inr(netPerAcre(r.id))} / ${t('acres').split('(')[1]?'acre':'acre'}</div></div><b>${r.score}%</b></button>`).join('')}
  <div class="card" style="margin-top:6px"><label class="l">${t('acres')}</label><div class="stepper" style="margin-top:10px"><button onclick="setAcres(${app.acres}-.5)">−</button><input type="number" min=".5" step=".5" value="${app.acres}" onchange="setAcres(this.value)"><button onclick="setAcres(${app.acres}+.5)">+</button></div></div>
  <button class="btn gold" onclick="go('plan')">🚜 ${t('confirm')}</button></div>`;
};
function setAcres(v){v=parseFloat(v);if(!(v>=.5))v=.5;app.acres=Math.min(100,v);render()}
/* plan */
function priceChart(p){
  const W=340,H=150,pl=34,pr=14,pt=22,pb=26;const vs=p.series.map(x=>x.v);const mn=Math.min(...vs)*.96,mx=Math.max(...vs)*1.04;
  const X=i=>pl+i*(W-pl-pr)/5,Y=v=>pt+(1-(v-mn)/(mx-mn))*(H-pt-pb);
  const pts=p.series.map((x,i)=>[X(i),Y(x.v)]);const line=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  const area=line+` L${X(5)} ${H-pb} L${X(0)} ${H-pb}Z`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%"><defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#52c57a" stop-opacity=".45"/><stop offset="1" stop-color="#52c57a" stop-opacity="0"/></linearGradient></defs>
  ${[0,.5,1].map(f=>{const y=pt+f*(H-pt-pb);return `<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#e1ebdc"/><text x="${pl-4}" y="${y+3}" font-size="9" text-anchor="end" fill="#5f7566">${Math.round(mx-(mx-mn)*f)}</text>`}).join('')}
  <path d="${area}" fill="url(#pg)"/><path d="${line}" fill="none" stroke="#14804a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  ${pts.map((q,i)=>`<circle cx="${q[0]}" cy="${q[1]}" r="${i===5?6:3.5}" fill="${i===5?'#f6b93b':'#fff'}" stroke="#14804a" stroke-width="2"/><text x="${q[0]}" y="${H-8}" font-size="9" text-anchor="middle" fill="#5f7566">${p.series[i].d.toLocaleDateString(LC[app.lang],{month:'short'})}</text>`).join('')}
  <text x="${pts[5][0]-4}" y="${pts[5][1]-11}" font-size="11" font-weight="700" text-anchor="end" fill="#a86b00">${inr(p.ph)}</text></svg>`;
}
R.plan=()=>{
  if(!app.chosen){computeReco();app.chosen=app.reco[0].id}
  const id=app.chosen,c=CROPS[id],p=planData(id,app.acres);
  const txt=fmt(t('plan_txt'),{crop:cn(id),days:c.days,cost:inr(p.cost),inc:inr(p.inc),net:inr(p.net),date:fdate(p.hv)});window._planTxt=txt;
  const labels=['b_seed','b_fert','b_pest','b_labour','b_irr'];const tot=p.cost;
  return bar(t('plan_t'),'decide')+`<div class="wrap">
  <div class="top-crop"><div class="row"><div class="em">${c.icon}</div><div class="sp"><h2 style="font-size:22px">${cn(id)}</h2><small style="color:#c9efb0">${app.acres} acre · ${c.days} ${t('days')}</small></div></div>
   <div class="mini" style="margin-top:12px"><div>🌱<b>${fdate(p.sow)}</b>${t('sow')}</div><div>🧺<b>${fdate(p.hv)}</b>${t('harvest')}</div></div><button class="spk" onclick="speak(window._planTxt)">${IC.spk} ${t('listen')}</button></div>
  <div class="card"><h3>⏱️ ${t('duration')}</h3><div class="tl"><div><i>🌱</i><b>${t('sow')}</b>${p.sow.toLocaleDateString(LC[app.lang],{day:'numeric',month:'short'})}</div><div><i>🌿</i><b>${t('grow')}</b>${p.grow.toLocaleDateString(LC[app.lang],{day:'numeric',month:'short'})}</div><div><i>🌼</i><b>${t('flower')}</b>${p.flower.toLocaleDateString(LC[app.lang],{day:'numeric',month:'short'})}</div><div><i>🧺</i><b>${t('harvest_s')}</b>${p.hv.toLocaleDateString(LC[app.lang],{day:'numeric',month:'short'})}</div></div></div>
  <div class="card"><h3>🌰 ${t('seeds')}</h3><ul class="list">${c.seeds.map(x=>`<li data-i="•">${x}</li>`).join('')}</ul></div>
  <div class="card"><h3>🧪 ${t('fert')}</h3><ul class="list">${c.fert.map(x=>`<li data-i="•">${x}</li>`).join('')}</ul></div>
  <div class="card"><h3>🐛 ${t('pest')}</h3><ul class="list">${c.pest.map(x=>`<li data-i="•">${x}</li>`).join('')}</ul></div>
  <div class="card bars bud"><h3>💼 ${t('budget')}</h3>${p.parts.map((v,i)=>`<div class="b"><div class="t"><span>${t(labels[i])}</span><b>${inr(v)}</b></div><div class="tr"><i style="width:${Math.round(v/tot*100)}%"></i></div></div>`).join('')}</div>
  <div class="trio"><div><small>${t('total_cost')}</small><b>${inr(p.cost)}</b></div><div><small>${t('exp_income')}</small><b>${inr(p.inc)}</b></div><div class="pf"><small>${t('net_profit')}</small><b>${inr(p.net)}</b></div></div>
  <div class="card"><h3>📈 ${t('price_pred')}</h3>${priceChart(p)}<p class="mut" style="font-size:11.5px">${t('price_note')}</p></div>
  <div class="note">ℹ️ ${t('plan_note')}</div>
  <div class="two"><button class="btn alt" onclick="go('alerts')">⛈️ ${t('q_alert')}</button><button class="btn alt" onclick="go('schemes')">🏛️ ${t('q_scheme')}</button></div></div>`;
};
/* alerts */
R.alerts=()=>{
  const keys=['rain','heat','drought','frost','pest'];const a=ALERTS[app.alertTab];
  return bar(t('alert_t'),'more')+`<div class="tabs">${keys.map(k=>`<button class="${app.alertTab===k?'on':''}" onclick="app.alertTab='${k}';render()">${ALERTS[k].i} ${t('a_'+k)}</button>`).join('')}</div>
  <div class="wrap"><div class="card"><h3>🛡️ ${t('prevent')}</h3><ul class="list">${a.pre.map(x=>`<li data-i="✔️">${x}</li>`).join('')}</ul></div>
  <div class="card"><h3>🚨 ${t('protect')}</h3><ul class="list">${a.pro.map(x=>`<li data-i="✔️">${x}</li>`).join('')}</ul></div></div>`;
};
/* schemes */
R.schemes=()=>{
  window._dmg=t('dmg_txt');
  return bar(t('scheme_t'),'more')+`<div class="wrap"><div class="note warn" style="line-height:1.55"><b>🚨 ${t('dmg_t')}</b><br>${esc(t('dmg_txt'))}<br><button class="spk" style="background:#fff" onclick="speak(window._dmg)">${IC.spk} ${t('listen')}</button></div>
  ${SCHEMES.map(s=>`<div class="card"><h3>${s[0]} ${s[1]}</h3><p style="line-height:1.5">${s[2]}</p><p class="mut" style="margin-top:8px;font-size:12.5px;line-height:1.5">👉 ${s[3]}</p></div>`).join('')}
  <div class="note">ℹ️ ${t('scheme_note')}</div></div>`;
};
/* more */
R.more=()=>bar(t('more_t'),null)+`<div class="wrap">
  <button class="menu" onclick="go('alerts')"><div class="e">⛈️</div><div class="sp"><b>${t('q_alert')}</b></div>›</button>
  <button class="menu" onclick="go('schemes')"><div class="e">🏛️</div><div class="sp"><b>${t('q_scheme')}</b></div>›</button>
  <button class="menu" onclick="go('decide')"><div class="e">📋</div><div class="sp"><b>${t('q_plan')}</b></div>›</button>
  <div class="menu" style="cursor:default"><div class="e">🌐</div><div class="sp"><b>${t('lang')}</b></div>${langSel().replace('class="lang"','class="lang" style="background:#e6f5ea"')}</div>
  <button class="menu" onclick="app.otpSent=false;app.phone='';app.chat=[];go('login')"><div class="e">🚪</div><div class="sp"><b>${t('logout')}</b></div>›</button>
  <p class="hint" style="margin-top:14px">KrushiMithra · v0.1 front-end prototype</p></div>`;
/* assistant */
function findCrop(s){
  for(const [id,c] of Object.entries(CROPS)){
    const names=[id,...Object.values(c.n)].map(x=>x.toLowerCase().split(/[ (]/)[0]);if(id==='paddy')names.push('rice');
    if(names.some(n=>n&&s.includes(n)))return id;
  }return null;
}
function botReply(q){
  const s=q.toLowerCase();computeReco();
  const has=a=>a.some(k=>s.includes(k));
  const cid=findCrop(s);
  if(cid){const r=app.reco.find(x=>x.id===cid),c=CROPS[cid];const lead=whyText(r);
    return{text:lead+'\n\n👍 '+t('profits')+': '+c.pros.join('; ')+'.\n⚠️ '+t('faults')+': '+c.cons.join('; ')+'.',speak:lead,action:{label:'✅ '+t('choose'),fn:`app.chosen='${cid}';go('decide')`}}}
  if(has(['scheme','insurance','yojana','subsidy','pm-kisan','kisan','ಯೋಜನೆ','ವಿಮೆ','योजना','बीमा','పథకం','భీమా','బీమా','திட்டம்','காப்பீடு']))return{text:t('c_scheme'),action:{label:'🏛️ '+t('q_scheme'),fn:"go('schemes')"}};
  if(has(['weather','rain','temperature','climate','ಹವಾಮಾನ','ಮಳೆ','मौसम','बारिश','వాతావరణ','వర్షం','வானிலை','மழை'])){const w=app.weather||demoWeather();return{text:fmt(t('c_weather'),{region:app.region||'Karnataka',temp:w.temp,hum:w.hum}),action:{label:'⛈️ '+t('q_alert'),fn:"go('alerts')"}}}
  if(has(['soil','fertil','ಮಣ್ಣು','मिट्टी','నేల','மண்']))return{text:t('c_soil'),action:{label:'🌱 '+t('q_soil'),fn:"app.soilStep=1;app.soil=null;go('soil')"}};
  if(has(['crop','grow','which','best','plant','ಬೆಳೆ','फसल','పంట','பயிர்','सबसे','ಉತ್ತಮ','ఉత్తమ','சிறந்த'])){const top=app.reco[0];return{text:fmt(t('c_crop'),{crop:cn(top.id),score:top.score}),action:{label:'🌾 '+t('q_crop'),fn:"go('reco')"}}}
  return{text:t('c_fb')};
}
R.ai=()=>{
  if(!app.chat.length)app.chat.push({r:'bot',text:t('c_greet')});
  const msgs=app.chat.map((m,i)=>`<div class="bub ${m.r}">${esc(m.text)}${m.r==='bot'?`<div><button class="spk" onclick="speakMsg(${i})">${IC.spk} ${t('listen')}</button></div>`:''}${m.action?`<div class="act"><button class="btn sm" onclick="${m.action.fn}">${esc(m.action.label)}</button></div>`:''}</div>`).join('');
  return bar(t('ai_t'),null)+`<div class="chat"><div class="msgs">${msgs}</div><div class="sug">${['sug1','sug2','sug3'].map(k=>`<button onclick="sendChat(t('${k}'),false)">${t(k)}</button>`).join('')}</div>
  <div class="chatbar"><input id="ci" placeholder="${t('ai_ph')}" onkeydown="if(event.key==='Enter')sendChat()"><button onclick="micChat()">${IC.mic}</button><button onclick="sendChat()">${IC.send}</button></div></div>`;
};
AFTER.ai=()=>{
  const v=$('#view');v.scrollTop=v.scrollHeight;
  if(app.pendingQ){const q=app.pendingQ;app.pendingQ=null;sendChat(q,app.pendingVoice)}
};
function speakMsg(i){const m=app.chat[i];speak(m.speak||m.text)}
function sendChat(text,voice){
  const el=$('#ci');const q=(text||(el&&el.value)||'').trim();if(!q)return;
  app.chat.push({r:'me',text:q});render();
  setTimeout(()=>{const rep=botReply(q);app.chat.push(Object.assign({r:'bot'},rep));if(app.screen==='ai')render();if(voice)speak(rep.speak||rep.text)},450);
}
function micChat(){listen(txt=>sendChat(txt,true))}

/* ===================== boot ===================== */
(function boot(){
  $('#spt').innerHTML='KrushiMithra'.split('').map((ch,i)=>`<span style="animation-delay:${1.2+i*.06}s">${ch}</span>`).join('');
  $('#spg').textContent=t('tagline');
  setTimeout(()=>go('login'),3300);
})();
</script>
